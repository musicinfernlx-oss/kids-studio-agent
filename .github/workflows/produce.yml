
name: Kids Studio Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create video
        run: |
        
mkdir -p output
ffmpeg -y \
  -f lavfi \
  -i "color=c=0x83D9FF:s=640x360:r=24:d=15" \
  -c:v libx264 \
  -threads 1 \
  -pix_fmt yuv420p \
  -t 15 \
  output/kids-video.mp4
